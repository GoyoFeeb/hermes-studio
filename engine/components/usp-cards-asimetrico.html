<!-- usp-cards-asimetrico.html — VARIANTE asimétrica de usp-cards.html. Mismo contrato de datos
     (uspSection.{eyebrow,title,body,badge} + usp[0..2].{icon,title,body}, mismo adaptador que la
     versión centrada). REDISEÑADO 2026-07-24 (ronda "romper composiciones repetidas" — ver
     engine/CHANGELOG.md/patterns/institutional.md §9): hasta esta fecha la cabecera era texto
     68% izquierda + insignia en caja de 32% derecha, vertical-align:middle — EXACTAMENTE el
     mismo esqueleto que intro-cta-asimetrico.html (texto+caja) y banda-cierre-asimetrico.html
     (texto+caja), solo con distinto contenido dentro de la caja. Como una insignia es una
     etiqueta informativa, no un CTA, no necesita el mismo peso de columna que un botón — ahora
     vive como un chip pequeño (shrink-to-fit, `width="1"` + `white-space:nowrap`, el truco
     estándar de "columna de ancho automático" en email) alineado arriba y a la derecha del
     título, en su propia fila, con el cuerpo debajo a todo el ancho. Elimina el patrón de
     2 columnas de igual peso para este módulo — la cabecera ya no compite visualmente con
     intro-cta/banda-cierre. Las 3 tarjetas debajo no cambian. Elegir esta variante frente a la
     centrada es una decisión de marca — ver brand-tokens.json → layout.sectionStyle y
     patterns/institutional.md §7. -->
<tr>
<td style="background-color:{{token:surfaces.sectionLila}};padding:0;">
  <table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%">
    <tr>
      <td class="mobile-pad-sm" style="padding:52px 32px 4px;">
        <p style="font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;color:{{token:colors.light}};margin:0;line-height:16px;letter-spacing:3px;text-transform:uppercase;text-align:left;mso-line-height-rule:exactly;">
          {{data:uspSection.eyebrow}}
        </p>
      </td>
    </tr>
    <tr>
      <td class="mobile-pad-sm" style="padding:4px 32px 0;">
        <table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%">
          <tr>
            <td align="left" style="vertical-align:top;" class="mobile-stack">
              <h2 class="mobile-section-title" style="font-family:{{token:typography.displayFont}};font-size:22px;font-weight:800;color:{{token:colors.primary}};margin:0;line-height:1.25;letter-spacing:-0.3px;text-align:left;mso-line-height-rule:exactly;">
                {{data:uspSection.title}}
              </h2>
            </td>
            <td align="right" width="1" style="white-space:nowrap;padding:3px 0 0 16px;vertical-align:top;" class="mobile-stack">
              <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="background-color:{{token:colors.primary}};border-radius:6px;">
                <tr>
                  <td align="center" style="padding:7px 12px;">
                    <p style="font-family:Arial,Helvetica,sans-serif;font-size:11px;font-weight:700;color:#FFFFFF;margin:0;line-height:1.3;letter-spacing:0.2px;white-space:nowrap;text-align:center;mso-line-height-rule:exactly;">&#9733; {{data:uspSection.badge}}</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td class="mobile-pad-sm" style="padding:10px 32px 28px;">
        <p style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:400;color:{{token:colors.text.secondary}};margin:0;line-height:1.6;text-align:left;mso-line-height-rule:exactly;">
          {{data:uspSection.body}}
        </p>
      </td>
    </tr>
    <tr>
      <td class="mobile-pad-sm" style="padding:0 24px 52px;">{{#each:uspRows}}
        <table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%">
          <tr>{{#each:items}}
            <td style="width:{{data:colWidth}};padding:{{data:cellPad}};vertical-align:top;" class="mobile-stack">
              <table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%" style="background-color:#FFFFFF;border:1px solid {{token:colors.borders.card}};border-radius:{{token:radius.card}}px;box-shadow:{{token:shadows.card}};">
                <tr><td align="center" style="padding:20px 14px;">
                  <p style="font-size:24px;line-height:1;margin:0 0 8px;text-align:center;">{{data:icon}}</p>
                  <h3 style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;color:{{token:colors.primary}};margin:0 0 4px;line-height:1.3;text-align:center;mso-line-height-rule:exactly;">{{data:title}}</h3>
                  <p style="font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:400;color:{{token:colors.text.secondary}};margin:0;line-height:1.45;text-align:center;mso-line-height-rule:exactly;">{{data:body}}</p>
                </td></tr>
              </table>
            </td>{{/each}}
          </tr>
        </table>{{/each}}
      </td>
    </tr>
  </table>
</td>
</tr>

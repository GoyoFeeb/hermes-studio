<!-- intro-cta-asimetrico.html — VARIANTE asimétrica de intro-cta.html. Nivel 2 (2026-07-22, ver
     engine/CHANGELOG.md "Nivel 2"). Mismo contrato de datos que intro-cta.html (intro.{title,
     body} + cta.href/cta.label via include) — SOLO cambia la composición: en vez de título+
     cuerpo+CTA apilados y centrados sobre blanco, título+cuerpo van a la izquierda (64%) y el
     CTA a la derecha (36%), alineados verticalmente al centro. En mobile apila
     (mobile-stack). Elegir esta variante frente a la centrada es una decisión de marca — ver
     brand-tokens.json → layout.sectionStyle y patterns/institutional.md §7. -->
<tr>
<td style="background-color:#FFFFFF;padding:0;">
  <table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%">
    <tr>
      <td align="left" class="mobile-pad-sm" style="padding:48px 40px 48px;">
        <table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%">
          <tr>
            <td align="left" style="width:64%;padding:0 24px 0 0;vertical-align:middle;" class="mobile-stack">
              <h2 class="mobile-section-title" style="font-family:{{token:typography.displayFont}};font-size:22px;font-weight:800;color:{{token:colors.primary}};margin:0 0 10px;line-height:1.25;letter-spacing:-0.3px;text-align:left;mso-line-height-rule:exactly;">
                {{data:intro.title}}
              </h2>
              <p style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:400;color:{{token:colors.text.secondary}};margin:0;line-height:1.6;text-align:left;mso-line-height-rule:exactly;">
                {{data:intro.body}}
              </p>
            </td>
            <td align="center" style="width:36%;padding:16px 0 0;vertical-align:middle;" class="mobile-stack">
              <table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%" class="mobile-full">
                <tr>
                  <td align="center" style="padding:0;">
                    {{include:cta-secondary-bulletproof}}
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</td>
</tr>

<!-- cta-block-bulletproof.html — CTA de BLOQUE SÓLIDO, esquinas rectas (2026-07-25, ronda
     "vocabulario visual" — ver engine/CHANGELOG.md). Cuarta silueta de CTA del motor (junto a
     cta-bulletproof.html/píldora, cta-secondary-bulletproof.html/outline,
     cta-text-link-bulletproof.html/texto). border-radius fijo en 0 — a propósito NO lee
     radius.ctaPill: el punto de esta variante es una silueta arquitectónica distinta a la píldora,
     no una píldora con radio pequeño (eso ya lo cubre cta-bulletproof.html con el radius real de
     cada marca, ej. BMW radius.ctaPill:3). Solo usarla cuando la investigación real de marca
     (agente 02, con Chrome) verifica botones de esquina recta como tratamiento deliberado en el
     sitio real — no como sustituto genérico de la píldora. Misma flecha "→" que
     cta-text-link-bulletproof.html, aquí dentro del bloque de color, para reforzar el carácter
     gráfico/editorial de la silueta. Tokens: colors.ctaBackground/ctaText, typography.displayFont,
     typography.cta.size/weight/letterSpacing, components.cta.padding, shadows.cta. Placeholders
     {{data:cta.href}}/{{data:cta.label}} resueltos en el scope del PADRE vía {{include:}}. Mismo
     bloque VML que cta-bulletproof.html pero con arcsize 0% (rectángulo, no píldora) para Outlook
     de escritorio clásico. -->

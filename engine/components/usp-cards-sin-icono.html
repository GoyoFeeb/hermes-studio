<!-- usp-cards-sin-icono.html — variante SIN icono de usp-cards.html (2026-07-24, campaña Spotify).
     Motivo real, no aspiracional: brands/spotify/tokens/brand-tokens.json → iconography (observado
     con Chrome real sobre spotify.com/us/premium/) documenta que el único elemento icónico real de
     Spotify es su propio isotipo de barras de sonido usado como máscara sobre fotografía, no un set
     de iconos de beneficio — y desaconseja explícitamente forzar iconGlyph de emoji genérico en
     usp-cards/columns-3-beneficios. El motor no tenía ninguna variante de usp-cards sin campo icon
     obligatorio (a diferencia de columns-3-beneficios, que ya tiene columns-3-beneficios-sin-icono
     desde la campaña BMW) — el schema lo exigía y la única forma de rellenarlo era un emoji que el
     propio análisis de marca prohíbe. Mismo contrato de datos que usp-cards EXCEPTO que usp[].items
     no lleva icon: se sustituye por la misma barrita de color (28x2, colors.light) que ya usa
     columns-3-beneficios-sin-icono, para mantener aire vertical sin depender de un glifo. Mismo
     layout 33/33/33, mismo box-shadow/border/radius en las tarjetas. Datos: uspSection.{eyebrow,
     title,body,badge} + usp[0..2].{title,body} (SIN icon). -->
<tr>
<td style="background-color:{{token:surfaces.sectionLila}};padding:0;">
  <table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%">
    <tr>
      <td align="center" class="mobile-pad-sm" style="padding:52px 32px 6px;">
        <p style="font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;color:{{token:colors.light}};margin:0 0 8px;line-height:16px;letter-spacing:3px;text-transform:uppercase;text-align:center;mso-line-height-rule:exactly;">
          {{data:uspSection.eyebrow}}
        </p>
        <h2 class="mobile-section-title" style="font-family:{{token:typography.displayFont}};font-size:22px;font-weight:800;color:{{token:colors.primary}};margin:0 0 12px;line-height:1.25;letter-spacing:-0.3px;text-align:center;mso-line-height-rule:exactly;">
          {{data:uspSection.title}}
        </h2>
        <p style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:400;color:{{token:colors.text.secondary}};margin:0 0 28px;line-height:1.6;text-align:center;mso-line-height-rule:exactly;">
          {{data:uspSection.body}}
        </p>
      </td>
    </tr>
    <tr>
      <td class="mobile-pad-sm" style="padding:0 24px 24px;">{{#each:uspRows}}
        <table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%">
          <tr>{{#each:items}}
            <td style="width:{{data:colWidth}};padding:{{data:cellPad}};vertical-align:top;" class="mobile-stack">
              <table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%" style="background-color:#FFFFFF;border:1px solid {{token:colors.borders.card}};border-radius:{{token:radius.card}}px;box-shadow:{{token:shadows.card}};">
                <tr><td align="center" style="padding:22px 14px;">
                  <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="margin:0 auto 12px;">
                    <tr><td width="24" height="2" style="background-color:{{token:colors.light}};border-radius:1px;font-size:0;line-height:0;">&nbsp;</td></tr>
                  </table>
                  <h3 style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;color:{{token:colors.primary}};margin:0 0 4px;line-height:1.3;text-align:center;mso-line-height-rule:exactly;">{{data:title}}</h3>
                  <p style="font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:400;color:{{token:colors.text.secondary}};margin:0;line-height:1.45;text-align:center;mso-line-height-rule:exactly;">{{data:body}}</p>
                </td></tr>
              </table>
            </td>{{/each}}
          </tr>
        </table>{{/each}}
      </td>
    </tr>
    <tr>
      <td align="center" class="mobile-pad-sm" style="padding:0 24px 52px;">
        <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="background-color:{{token:colors.primary}};border-radius:8px;margin:0 auto;">
          <tr>
            <td align="center" style="padding:14px 24px;">
              <p style="font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:700;color:#FFFFFF;margin:0;line-height:1.4;letter-spacing:0.2px;text-align:center;mso-line-height-rule:exactly;">&#9733; {{data:uspSection.badge}}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</td>
</tr>

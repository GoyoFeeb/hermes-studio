<!-- intro-cta.html — bloque introductorio: título + cuerpo + CTA, centrado sobre blanco. Añadido 2026-07-22 (patrón institutional, campaña UAX — ver engine/CHANGELOG.md). Datos: intro.{title,body} + cta.href/cta.label (via include, mismo mecanismo que hero-asimetrico/banda-cierre: el adaptador duplica "cta" en la raíz del scope). Tokens: colors.primary, colors.text.secondary -->
<tr>
<td style="background-color:#FFFFFF;padding:0;">
  <table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%">
    <tr>
      <td align="center" class="mobile-pad-sm" style="padding:48px 40px 0;">
        <h2 class="mobile-section-title" style="font-family:{{token:typography.displayFont}};font-size:22px;font-weight:800;color:{{token:colors.primary}};margin:0 0 14px;line-height:1.25;letter-spacing:-0.3px;text-align:center;mso-line-height-rule:exactly;">
          {{data:intro.title}}
        </h2>
        <p style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:400;color:{{token:colors.text.secondary}};margin:0 0 26px;line-height:1.6;text-align:center;mso-line-height-rule:exactly;">
          {{data:intro.body}}
        </p>
        <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="margin:0 auto;" class="mobile-full">
          <tr>
            <td align="center" style="padding:0;">
              {{include:cta-secondary-bulletproof}}
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr><td style="padding:0 0 44px;font-size:0;line-height:0;">&nbsp;</td></tr>
  </table>
</td>
</tr>

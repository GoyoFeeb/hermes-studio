<!-- lista-premium.html — lista de 3-4 tarjetas con badge de icono, repetible via each. RESTAURADO 2026-07-21 (ver engine/CHANGELOG.md). Datos: listSection.{eyebrow,title} + listItems[] (icon/title/body sin prefijo dentro del each) -->
<tr>
<td style="background-color:{{token:surfaces.sectionLila}};padding:0;">
  <table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%">
    <tr>
      <td align="left" class="mobile-pad-sm" style="padding:56px 24px 44px;">
        <table border="0" cellpadding="0" cellspacing="0" role="presentation" align="left" style="margin:0 0 10px;">
          <tr><td width="32" height="2" style="background-color:{{token:colors.light}};font-size:0;line-height:0;">&nbsp;</td></tr>
        </table>
        <p style="font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;color:{{token:colors.light}};margin:0 0 6px;line-height:16px;letter-spacing:3px;text-transform:uppercase;text-align:left;mso-line-height-rule:exactly;">
          {{data:listSection.eyebrow}}
        </p>
        <h2 class="mobile-section-title" style="font-family:{{token:typography.displayFont}};font-size:22px;font-weight:800;color:{{token:colors.primary}};margin:0 0 24px;line-height:1.2;letter-spacing:-0.3px;text-align:left;mso-line-height-rule:exactly;">
          {{data:listSection.title}}
        </h2>

{{#each:listItems}}        
        <table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%" style="background-color:#FFFFFF;border:1px solid {{token:colors.borders.card}};border-radius:{{token:radius.card}}px;box-shadow:{{token:shadows.card}};margin:0 0 12px;">
          <tr><td height="4" style="background-color:{{token:colors.light}};border-radius:{{token:radius.cardStripe}};font-size:0;line-height:0;">&nbsp;</td></tr>
          <tr>
            <td style="padding:20px 22px 22px;">
              <table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%">
                <tr>
                  <td width="36" valign="middle" style="padding:0 14px 0 0;">
                    <table border="0" cellpadding="0" cellspacing="0" role="presentation">
                      <tr>
                        <td align="center" style="background-color:{{token:colors.primary}};border-radius:50%;width:36px;height:36px;line-height:0;">
                          <img src="{{data:icon}}" alt="" width="36" height="36" style="display:block;outline:none;border:none;width:36px;height:36px;">
                        </td>
                      </tr>
                    </table>
                  </td>
                  <td align="left" valign="middle">
                    <h3 style="font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;color:{{token:colors.primary}};margin:0 0 2px;line-height:20px;mso-line-height-rule:exactly;">{{data:title}}</h3>
                    <p style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:400;color:{{token:colors.text.secondary}};margin:0;line-height:1.5;mso-line-height-rule:exactly;">{{data:body}}</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
{{/each}}        

      </td>
    </tr>
  </table>
</td>
</tr>

<!-- category-grid.html — grid de categorías, hasta 3 por fila (balancedRows evita filas huérfanas — fix 2026-07-28, Fase F4: antes un bucle propio podía dejar un ítem solo en su fila a 33% de ancho, ver engine/CHANGELOG.md), envuelve a la fila siguiente para CUALQUIER número de ítems (2-8). Añadido 2026-07-22 (patrón institutional). El adaptador de lib/assemble.js agrupa "categories[]" en "rows[].items[]" en JS ANTES de renderizar, con colWidth/cellPad por celda (balancedRows/withCellGeometry, igual que columns-3-beneficios/usp-cards). Datos: gridSection.{title,intro} + rows[].items[].{icon,title,subtitle,colWidth,cellPad} (generado por el adaptador — en campaign-data.json NO se escriben "rows", solo "categories" plano) + cta.href/cta.label (via include). Tokens: colors.primary, colors.text.secondary, surfaces.sectionLila -->
<tr>
<td style="background-color:#FFFFFF;padding:0;">
  <table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%">
    <tr>
      <td align="center" class="mobile-pad-sm" style="padding:52px 24px 6px;">
        <h2 class="mobile-section-title" style="font-family:{{token:typography.displayFont}};font-size:22px;font-weight:800;color:{{token:colors.primary}};margin:0 0 8px;line-height:1.25;letter-spacing:-0.3px;text-align:center;mso-line-height-rule:exactly;">
          {{data:gridSection.title}}
        </h2>
        <p style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:400;color:{{token:colors.text.secondary}};margin:0 0 28px;line-height:1.5;text-align:center;mso-line-height-rule:exactly;">
          {{data:gridSection.intro}}
        </p>
      </td>
    </tr>
    <tr>
      <td class="mobile-pad-sm" style="padding:0 24px 8px;">
{{#each:rows}}
        <table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%" style="margin:0 0 12px;">
          <tr>
{{#each:items}}
            <td style="width:{{data:colWidth}};padding:{{data:cellPad}};vertical-align:top;" class="mobile-stack">
              <table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%" style="background-color:{{token:surfaces.sectionLila}};border-radius:{{token:radius.card}}px;">
                <tr>
                  <td align="center" style="padding:20px 12px;">
                    <p style="font-size:24px;line-height:1;margin:0 0 8px;text-align:center;">{{data:icon}}</p>
                    <h3 style="font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;color:{{token:colors.primary}};margin:0 0 4px;line-height:1.3;text-align:center;mso-line-height-rule:exactly;">{{data:title}}</h3>
                    <p style="font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:400;color:{{token:colors.text.secondary}};margin:0;line-height:1.4;text-align:center;mso-line-height-rule:exactly;">{{data:subtitle}}</p>
                  </td>
                </tr>
              </table>
            </td>
{{/each}}
          </tr>
        </table>
{{/each}}
      </td>
    </tr>
    <tr>
      <td align="center" class="mobile-pad-sm" style="padding:16px 24px 52px;">
        <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="margin:0 auto;" class="mobile-full">
          <tr>
            <td align="center" style="padding:0;">
              {{include:cta-secondary-bulletproof}}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</td>
</tr>

x-60/assets/showroom/02-gallery-navigation-cx60-desktop-3-technology2.jpg?rnd=4a063c"}},"mobileImage":{"url":"https://media-assets.mazda.eu/image/upload/q_auto,f_auto/mazdaes/globalassets/cars/2025-mazda-cx-60/assets/showroom/02-gallery-navigation-cx60-mobile-3-technology2.jpg?rnd=4a063c","assetTransformationInfo":{"focalPoint":{"x":0.0,"y":0.0},"originalWidth":720,"originalHeight":406,"assetUrl":"mazdaes/globalassets/cars/2025-mazda-cx-60/assets/showroom/02-gallery-navigation-cx60-mobile-3-technology2.jpg?rnd=4a063c"}},"cta":[{"text":"Reserva una prueba de conducción","ariaLabel":"Reserva una prueba de conducción del Mazda CX-60","link":"/formularios/prueba-de-conduccion/?model=MAZDA%20CX-60","theme":"light","type":"secondary","ctaModule":"cta","icon":"TEST_DRIVE","target":"_self","largeCta":false,"deepLinkCar":false,"dataLayerEvent":"test drive request","selected":false,"dataLayer":{"source":"showroom","category":"test_drive_request"}}]}],"paddingBottom":false,"paddingTop":false,"theme":"light"},"type":"slidingGalleryNavigation"},{"props":{"backgroundImage":{"url":"https://media-assets.mazda.eu/image/upload/q_auto,f_auto/mazdaes/globalassets/cars/2025-mazda-cx-60/assets/showroom/placeholder-intro2.jpg?rnd=4a062b","assetTransformationInfo":{"focalPoint":{"x":0.0,"y":0.0},"originalWidth":400,"originalHeight":400,"assetUrl":"mazdaes/globalassets/cars/2025-mazda-cx-60/assets/showroom/placeholder-intro2.jpg?rnd=4a062b"}},"contentPlacement":"leftnobackground","copy":"\u003cp\u003eCambia tu forma de conducir con solo pulsar un bot\u0026oacute;n. El sistema Mi-Drive ofrece hasta cinco modos de conducci\u0026oacute;n, como Normal y Sport, para adaptarse tanto a tu estado de \u0026aacute;nimo como a las condiciones del entorno. En versiones con tracci\u0026oacute;n total, tambi\u0026eacute;n incluye los modos Off-road y Remolque, mientras que la transmisi\u0026oacute;n PHEV a\u0026ntilde;ade un modo EV para disfrutar de una conducci\u0026oacute;n 100\u0026nbsp;% el\u0026eacute;ctrica.\u003c/p\u003e","cta":[{"text":"Solicita una prueba de conducción","ariaLabel":"Solicita una prueba de conducción del Mazda CX-60","link":"/formularios/prueba-de-conduccion/?model=MAZDA%20CX-60","theme":"light","type":"primaryoutline","ctaModule":"cta","icon":"TEST_DRIVE","target":"_self","largeCta":false,"deepLinkCar":false,"dataLayerEvent":"test drive request","selected":false,"dataLayer":{"source":"showroom","category":"test_drive_request"}}],"headline":{"content":"CINCO MODOS DE CONDUCCIÓN QUE SE ADAPTAN A TI"},"id":"d4847e2e-7b2c-40b0-91aa-d88e2682f81a|99789","paddingBottom":"l","paddingTop":"l","theme":"dark"},"type":"slidingTextblock"},{"props":{"id":"1360c443-0482-4079-a83e-86382e6600a0|99795","title":"","textBlock":"\\u003cp\\u003e\\u003cimg src=\\\"https://media-assets.mazda.eu/image/upload/q_auto,f_auto/mazdaes/contentassets/f14e826944b84f26b12be98a88b016c4/cx-60-special-idea-1920x1080.jpg.png?rnd=4a0622\\\" alt=\\\"CX-60-Special Idea-1920x1080.jpg.png\\\" /\\u003e\\u003c/p\\u003e","ctaDirection":"row","horizontalAlignment":"center","backgroundHEX":"#101010","numberBlocks":[],"contentDisplayOption":"fullWidth","topBlockSpacing":"half","bottomBlockSpacing":"full"},"submodules":[],"type":"textBlockFull"},{"props":{"id":"813b617e-b1cf-4b73-8a42-e5ace416ceea|99802","label":"Experiencia de conducción"},"type":"agendaTrigger"},{"props":{"id":"79b183fb-88ce-43f2-875d-864b6e802065|99803","anchorLink":"diesel"},"type":"anchorBlock"},{"props":{"id":"af19ab36-1273-4cd1-9623-db4596e45282|99804","anchorLink":"technology"},"type":"anchorBlock"},{"props":{"id":"ead0dfda-88fe-4b3b-ba47-0c0d7943f4d8|99805","anchorLink":"engine-types"},"type":"anchorBlock"},{"props":{"id":"55363d0e-20e6-4b05-b0b2-44edf97d962e|99780","headline":{"content":"DOS OPCIONES DE PROPULSIÓN"},"copy":"\u003cp\u003eEl Mazda CX-60 ofrece dos opciones de transmisi\u0026oacute;n adaptadas a diversos estilos de conducci\u0026oacute;n. Puedes elegir entre un h\u0026iacute;brido enchufable (PHEV) y dos motores h\u0026iacute;bridos di\u0026eacute;sel, que incluyen los sistemas Mazda M Hybrid. Cada transmisi\u0026oacute;n se ha dise\u0026ntilde;ado meticulosamente para adaptarse a tus preferencias de rendimiento y ofrecerte una experiencia de conducci\u0026oacute;n excepcional.\u003c/p\u003e","sliders":[{"subheadline":"\u003ch3\u003eMAZDA CX-60 H\u0026Iacute;BRIDO ENCHUFABLE (PHEV)\u003c/h3\u003e","cards":[{"headline":"Rendimiento electrificado: nuestro híbrido enchufable","subline":"Eléctrico cuando quieres, gasolina cuando lo necesitas","mediaAsset":{"assetProperties":{"url":"https://media-assets.mazda.eu/image/upload/q_auto,f_auto/mazdaes/globalassets/cars/2025-mazda-cx-60/assets/showroom/03-expandable-card-module-cx60-phev-12.jpg?rnd=4a0652","assetTransformationInfo":{"focalPoint":{"x":0.0,"y":0.0},"originalWidth":900,"originalHeight":512,"assetUrl":"mazdaes/globalassets/cars/2025-mazda-cx-60/assets/showroom/03-expandable-card-module-cx60-phev-12.jpg?rnd=4a0652"}},"type":"image"},"additionalContent":{"copy":"\u003cp\u003eDisfruta lo mejor de ambos mundos. El Mazda CX-60 PHEV combina potencia y versatilidad con motor de gasolina y el\u0026eacute;ctrico trabajando en armon\u0026iacute;a, con m\u0026aacute;xima flexibilidad.\u003c/p\u003e"},"closeOverlayLabel":"cerrar","openOverlayLabel":"abrir"},{"headline":"Autonomía totalmente eléctrica","subline":"El poder y el placer de conducir en el más puro modo EV","mediaAsset":{"assetProperties":{"url":"https://media-assets.mazda.eu/image/upload/q_auto,f_auto/mazdaes/contentassets/35998cbf309b4b9392176c68b4469008/mme-model-expandable-card-1.jpg?rnd=4a4170","assetTransformationInfo":{"focalPoint":{"x":0.0,"y":0.0},"originalWidth":1920,"originalHeight":1024,"assetUrl":"mazdaes/contentassets/35998cbf309b4b9392176c68b4469008/mme-model-expandable-card-1.jpg?rnd=4a4170"}},"type":"image"},"additionalContent":{"copy":"\u003cp\u003eDisfruta de hasta 64 km de autonom\u0026iacute;a de conducci\u0026oacute;n totalmente el\u0026eacute;ctrica (en uso combinado). Cuando se agote la bater\u0026iacute;a, puedes conectarte a una estaci\u0026oacute;n de carga o seguir conduciendo con el motor de gasolina.\u003c/p\u003e"},"closeOverlayLabel":"cerrar","openOverlayLabel":"abrir"},{"headline":"Disfruta de una carga sencilla","subline":"Estaciones de carga de CA y cargador doméstico","mediaAsset":{"assetProperties":{"url":"https://media-assets.mazda.eu/image/upload/q_auto,f_auto/mazdaes/contentassets/ae9e197970574d74af6a17599729eda5/cx60-expandable-card-charging.jpg?rnd=4a0653","assetTransformationInfo":{"focalPoint":{"x":0.0,"y":0.0},"originalWidth":1920,"originalHeight":1024,"assetUrl":"mazdaes/contentassets/ae9e197970574d74af6a17599729eda5/cx60-expandable-card-charging.jpg?rnd=4a0653"}},"type":"image"},"additionalContent":{"copy":"\u003cp\u003eCarga en casa por la noche o recarga en una estación de carga de CA durante tu trayecto. En función de la conexión a la red eléctrica de tu casa o del tipo de cargador al que tengas acceso, dispondrás de varias posibilidades de carga.\u003c/p\u003e"},"closeOverlayLabel":"cerrar","openOverlayLabel":"abrir"},{"headline":"Rendimiento electrificado","subline":"Pásate al eléctrico sin pensar en la autonomía","mediaAsset":{"assetProperties":{"url":"https://media-assets.mazda.eu/image/upload/q_auto,f_auto/mazdaes/globalassets/cars/2025-mazda-cx-60/assets/showroom/mme-cx-60-ipm-technology-card-780x5122.jpg?rnd=4a0653","assetTransformationInfo":{"focalPoint":{"x":0.0,"y":0.0},"originalWidth":780,"originalHeight":512,"assetUrl":"mazdaes/globalassets/cars/2025-mazda-cx-60/assets/showroom/mme-cx-60-ipm-technology-card-780x5122.jpg?rnd=4a0653"}},"type":"image"},"additionalContent":{"copy":"\u003cp\u003eTe encantará la eficiencia del motor eléctrico, que te ofrece una impresionante autonomía solo eléctrica. Además, con una capacidad de remolque de 2.500 kg, podrás remolcar cargas más pesadas con total facilidad. Gracias al motor de gasolina, tendrás la libertad de recorrer distancias más largas que las que puede ofrecer la batería por sí sola.\u003c/p\u003e"},"closeOverlayLabel":"cerrar","openOverlayLabel":"abrir"}],"showMediaInExpandedState":false,"isExpandedByDefault":false,"expandCta":{"id":"df365021-4022-495a-be48-aaea3c19e664|100030","text":"MÁS INFORMACIÓN","dataLayer":{"source":"showroom","category":""},"dataLayerEvent":""},"collapseCta":{"id":"a881ac43-4184-4b8c-8bf0-7e5f83f27d3a|100031","text":"VER MENOS","dataLayer":{"source":"showroom","category":""},"dataLayerEvent":""}},{"subheadline":"\u003ch3\u003eMAZDA CX-60 DI\u0026Eacute;SEL H\u0026Iacute;BRIDO\u003c/h3\u003e","cards":[{"headline":"Nuestro diésel más potente","subline":"Alta potencia y rendimiento suave","mediaAsset":{"assetProperties":{"url":"https://media-assets.mazda.eu/image/upload/q_auto,f_auto/mazdaes/globalassets/cars/2025-mazda-cx-60/assets/showroom/03-expandable-card-module-cx60-diesel-12.jpg?rnd=4a0653","assetTransformationInfo":{"focalPoint":{"x":0.0,"y":0.0},"originalWidth":900,"originalHeight":512,"assetUrl":"mazdaes/globalassets/cars/2025-mazda-cx-60/assets/showroom/03-expandable-card-module-cx60-diesel-12.jpg?rnd=4a0653"}},"type":"image"},"additionalContent":{"copy":"\u003cp\u003eEl Mazda CX-60 tambi\u0026eacute;n ofrece nuestro di\u0026eacute;sel m\u0026aacute;s potente. El motor 3,3 litros seis cilindros e-SKYACTIV D incorpora Mazda M Hybrid Boost de 48 V, que aporta gran rendimiento. El CX-80 e-Skyactiv D 2026 admite HVO 100.\u003c/p\u003e"},"closeOverlayLabel":"cerrar","openOverlayLabel":"abrir"},{"headline":"Alta tecnología para rendimiento híbrido","subline":"Explora el sistema Mazda M Hybrid Boost de 48 V","mediaAsset":{"assetProperties":{"url":"https://media-assets.mazda.eu/image/upload/q_auto,f_auto/mazdaes/globalassets/cars/2025-mazda-cx-60/assets/showroom/03-expandable-card-module-cx60-diesel-22.jpg?rnd=4a0654","assetTransformationInfo":{"focalPoint":{"x":0.0,"y":0.0},"originalWidth":900,"originalHeight":512,"assetUrl":"mazdaes/globalass ":"https://media-assets.mazda.eu/image/upload/q_auto,f_auto/mazdaes/globalassets/cars/2025-mazda-cx-60/assets/showroom/09-expandable-card-module-cx60-2-fallback2.jpg?rnd=4a0650","assetTransformationInfo":{"focalPoint":{"x":0.0,"y":0.0},"originalWidth":900,"originalHeight":512,"assetUrl":"mazdaes/globalassets/cars/2025-mazda-cx-60/assets/showroom/09-expandable-card-module-cx60-2-fallback2.jpg?rnd=4a0650"}}},"additionalContent":{},"closeOverlayLabel":"cerrar","openOverlayLabel":"abrir"},{"headline":"Control de crucero adaptativo por radar","subline":"Cómodo y fácil. El Control de crucero adaptativo por radar (MRCC) es un sistema adaptativo que utiliza radares para medir la velocidad y la distancia del vehículo que circula delante. Ajusta automáticamente la velocidad para mantener una distancia de seguridad, sin necesidad de pisar el freno o el acelerador.","mediaAsset":{"assetProperties":{"url":"https://media-assets.mazda.eu/video/upload/q_auto,f_auto/mazdaes/globalassets/cars/2025-mazda-cx-60/assets/showroom/09-expandable-card-module-cx60-3-fvideo2.mp4?rnd=4a0651","captions":[],"efficiencyWaterMark":{"efficiencyWatermarks":[],"position":"bottom-right","mobilePosition":"bottom-right","scale":0.45,"mobileScale":0.4},"carline":{"bodyType":"unknown"},"videoCategory":"unknown"},"type":"video","fallbackImage":{"url":"https://media-assets.mazda.eu/image/upload/q_auto,f_auto/mazdaes/globalassets/cars/2025-mazda-cx-60/assets/showroom/09-expandable-card-module-cx60-3-fallback2.jpg?rnd=4a0651","assetTransformationInfo":{"focalPoint":{"x":0.0,"y":0.0},"originalWidth":900,"originalHeight":512,"assetUrl":"mazdaes/globalassets/cars/2025-mazda-cx-60/assets/showroom/09-expandable-card-module-cx60-3-fallback2.jpg?rnd=4a0651"}}},"additionalContent":{},"closeOverlayLabel":"cerrar","openOverlayLabel":"abrir"},{"headline":"Mantenimiento de carril de emergencia (ELK)","subline":"El sistema de mantenimiento de carril de emergencia (ELK) se activa si el vehículo empieza a salirse del carril

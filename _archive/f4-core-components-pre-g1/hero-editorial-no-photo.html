<!-- hero-editorial-no-photo.html
  Patrón: Hero editorial sin foto — fondo de marca sólido, textos en blanco, cifra tipográfica
  Placeholders: [BRAND_COLOR], [BRAND_COLOR_DEEP], [LOGO_URL], [LOGO_ALT], [EYEBROW_TEXT], [BRAND_EYEBROW_ON_BRAND], [H1_TEXT], [BRAND_SUBTITLE_ON_BRAND], [STAT_NUMBER], [STAT_SIZE], [BRAND_STAT_LABEL_COLOR], [CTA_TEXT], [CTA_URL], [CTA_COLOR], [BRAND_MICROCOPY_COLOR]
  Fuente: v5-premium/final-premium.html (bloque de marca unificado, líneas 48-154)
-->
<tr>
<td style="background-color:[BRAND_COLOR];padding:0;">
  <table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%">

    <!-- Logo -->
    <tr>
      <td align="center" class="mobile-pad-sm" style="padding:28px 32px 20px;">
        <img src="[LOGO_URL]" alt="[LOGO_ALT]" width="176" height="48" style="display:block;outline:none;border:none;width:176px;height:48px;max-width:100%;">
      </td>
    </tr>

    <!-- Eyebrow -->
    <tr>
      <td align="center" class="mobile-pad-sm" style="padding:8px 32px 0;">
        <p style="font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;color:[BRAND_EYEBROW_ON_BRAND];margin:0;line-height:16px;letter-spacing:2.5px;text-transform:uppercase;mso-line-height-rule:exactly;">[EYEBROW_TEXT]</p>
      </td>
    </tr>

    <!-- Titular -->
    <tr>
      <td align="center" class="mobile-pad-sm" style="padding:14px 32px 0;">
        <h1 style="font-family:Arial,Helvetica,sans-serif;font-size:[H1_SIZE];font-weight:800;color:#FFFFFF;margin:0;line-height:1.14;mso-line-height-rule:exactly;">[H1_TEXT]</h1>
      </td>
    </tr>

    <!-- Subtítulo -->
    <tr>
      <td align="center" class="mobile-pad-sm" style="padding:14px 40px 0;">
        <p style="font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:400;color:[BRAND_SUBTITLE_ON_BRAND];margin:0;line-height:1.55;mso-line-height-rule:exactly;">[SUBTITLE_TEXT]</p>
      </td>
    </tr>

    <!-- Cifra de marca (sin caja separada — texto directo sobre fondo de marca) -->
    <tr>
      <td align="center" style="padding:28px 32px 0;">
        <table border="0" cellpadding="0" cellspacing="0" role="presentation">
          <tr>
            <td align="center" style="padding:0 0 4px;">
              <p style="font-family:Arial,Helvetica,sans-serif;font-size:[STAT_SIZE];font-weight:800;color:#FFFFFF;margin:0;line-height:1;mso-line-height-rule:exactly;">[STAT_NUMBER]</p>
            </td>
          </tr>
          <tr>
            <td align="center">
              <p style="font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;color:[BRAND_STAT_LABEL_COLOR];margin:0;line-height:16px;letter-spacing:1px;text-transform:uppercase;mso-line-height-rule:exactly;">[STAT_LABEL]</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- CTA con VML width 280px -->
    <tr>
      <td align="center" class="mobile-pad-sm" style="padding:28px 32px 0;">
        <table border="0" cellpadding="0" cellspacing="0" role="presentation" width="100%" class="mobile-full">
          <tr>
            <td align="center" style="padding:0;">
              <!--[if mso]>
              <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" xmlns:w="urn:schemas-microsoft-com:office:word"
                href="[CTA_URL]" style="height:52px;v-text-anchor:middle;width:280px;"
                arcsize="50%" strokecolor="[CTA_COLOR]" fillcolor="[CTA_COLOR]">
                <w:anchorlock/>
                <center style="color:#FFFFFF;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;">[CTA_TEXT]</center>
              </v:roundrect>
              <![endif]-->
              <!--[if !mso]><!-->
              <table border="0" cellpadding="0" cellspacing="0" role="presentation" style="width:100%;" class="mobile-full">
                <tr>
                  <td align="center" class="mobile-full" style="background-color:[CTA_COLOR];border-radius:50px;padding:14px 32px;">
                    <a href="[CTA_URL]" target="_blank" style="display:block;color:#FFFFFF;font-family:Arial,Helvetica,sans-serif;font-size:16px;font-weight:700;letter-spacing:0.5px;text-decoration:none;text-align:center;line-height:22px;mso-line-height-rule:exactly;">[CTA_TEXT]</a>
                  </td>
                </tr>
              </table>
              <!--<![endif]-->
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- Microcopy -->
    <tr>
      <td align="center" style="padding:12px 32px 32px;">
        <p style="font-family:Arial,Helvetica,sans-serif;font-size:13px;font-weight:400;color:[BRAND_MICROCOPY_COLOR];margin:0;line-height:18px;text-align:center;mso-line-height-rule:exactly;">[MICROCOPY_TEXT]</p>
      </td>
    </tr>

  </table>
</td>
</tr>
